<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="container">
        <div id="display">
            45+65+75
        </div>
        <div class="row" id="r1">
            <button>AC</button>
            <button>%</button>
            <button>X</button>
            <button>*</button>
        </div>
        <div class="row" id="r2">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
        </div>


        <div class="row" id="r3">

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
        </div>

        <div class="row" id="r4">

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
        </div>

        <div class="row" id="r5">

            <button>0</button>
            <button>.</button>
            <button>+/-</button>
            <button>=</button>
        </div>





    </div>













    <script src="javascript.js"></script>
</body>

</html>
